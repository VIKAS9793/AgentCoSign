[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentcosign"
version = "0.1.0"
description = "Dual control for AI agents that move money on PayPal: propose, decide, co-sign, prove"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "AGPL-3.0-only" }
authors = [
    { name = "Vikas Sahani", email = "vikassahani17@gmail.com" }
]
keywords = ["ai-agents", "paypal", "policy-gateway", "maker-checker", "security", "guardrails", "fastapi"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Framework :: FastAPI",
    "Topic :: Security",
]

dependencies = [
    # Bounded ranges: an upstream major release must not break a deploy.
    "fastapi>=0.115.0,<1",
    "uvicorn[standard]>=0.32.0,<1",
    "pydantic>=2.9.0,<3",
    "pydantic-settings>=2.6.0,<3",
    "pyyaml>=6.0.2,<7",
    "requests>=2.32.0,<3",
    "httpx>=0.27.2,<1",
    "python-dotenv>=1.0.1,<2",
    "openai>=1.54.0,<4",
    "webauthn>=3.0.1,<4",
]

[project.optional-dependencies]
# Optional: PayPal's toolkit supports Python <3.14 and pins crewai-tools, so it must
# never be required for the gateway, hermetic mode or CI. Core uses PayPal REST.
paypal-toolkit = ["paypal-agent-toolkit>=1.11.0,<2"]
dev = [
    "pytest>=8.3.0,<10",
    "pytest-asyncio>=0.24.0,<2",
    "pytest-cov>=6.0.0,<8",
    "httpx>=0.27.2,<1",
    "ruff>=0.9.0,<1",
    "mypy>=1.13.0,<3",
    "bandit>=1.8.0,<2",
    "hypothesis>=6.112.0,<7",
    "pip-audit>=2.7.0,<3",
    "types-requests>=2.32.0.20241016,<3",
    "types-PyYAML>=6.0.12.20240917,<7",
]

[project.urls]
Homepage = "https://github.com/VIKAS9793/AgentCoSign"
Repository = "https://github.com/VIKAS9793/AgentCoSign.git"
Issues = "https://github.com/VIKAS9793/AgentCoSign/issues"

[tool.setuptools.packages.find]
include = ["agentcosign*"]

# The landing page and its assets ship inside the wheel (the container installs
# the package, it does not run from the source tree).
[tool.setuptools.package-data]
agentcosign = ["web/*"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "S",   # flake8-bandit (security)
    "SIM", # flake8-simplify
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S603", "S607"]  # assert in tests; tests drive git directly
# The guardrail script runs fixed `git` commands (no user-supplied shell input).
"tools/*" = ["S603", "S607"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
# Default run is offline and credential-free so any clone is green.
# Run live checks explicitly: pytest -m integration
addopts = "-v --tb=short -m 'not integration'"
markers = [
    "edge: a race, lost or late answer, outside change, boundary, repeat or stale data",
    "integration: needs live network and credentials (PayPal sandbox, Groq, NIM)",
    "slow: long-running benchmark or soak test",
]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

[tool.pyright]
venvPath = "."
venv = ".venv"
include = ["agentcosign", "tests"]
