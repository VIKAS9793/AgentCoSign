# Render Blueprint. Needs the owner's explicit sign-off before every change
# (account, GitHub access, billing, credentials).
# Free web service: spins down after ~15 min idle (~1 min cold start) and loses
# local files on restart, so visitors' test workspaces reset when it sleeps (the
# app says so on the setup screen) and committed evidence lives in the repo.
#
# Live mode: real PayPal sandbox calls and live AI models. Credentials are
# declared below with `sync: false`: their values are entered by the owner in the
# Render dashboard and never stored in git. Gateway secrets are generated by Render.
services:
  - type: web
    name: agentcosign-demo
    runtime: docker
    plan: free
    region: oregon # US West: closest to the PayPal sandbox and to US reviewers
    branch: release # deploy from a frozen branch, never main, during judging
    autoDeploy: false # a push never redeploys; deploy is a deliberate manual action
    healthCheckPath: /health
    envVars:
      - key: AGENTCOSIGN_ENV
        value: demo
      # live AI models (not recorded answers) and the live PayPal sandbox
      - key: AGENTCOSIGN_REPLAY_MODE
        value: "false"
      - key: AGENTCOSIGN_PAYPAL_EXECUTION
        value: sandbox
      # passkeys are bound to this address: it must be the site's own origin
      - key: AGENTCOSIGN_PUBLIC_ORIGIN
        value: https://agentcosign-demo.onrender.com
      - key: AGENTCOSIGN_AGENT_KEY
        generateValue: true
      - key: AGENTCOSIGN_OPERATOR_KEY
        generateValue: true
      - key: AGENTCOSIGN_AUDIT_KEY
        generateValue: true
      # Shared token that raises live-call quotas for reviewers. Read the generated
      # value from the Render dashboard; nothing is gated behind it.
      - key: AGENTCOSIGN_REVIEWER_TOKEN
        generateValue: true
      # entered by the owner in the dashboard; never in git
      - key: GROQ_API_KEY
        sync: false
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_MERCHANT_ID
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
