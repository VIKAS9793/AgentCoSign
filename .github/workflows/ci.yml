name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy agentcosign/
      - run: bandit -q -r agentcosign/
      # Hermetic: no secrets, no network. This is what a judge's clone runs.
      - run: pytest --cov=agentcosign --cov-report=term-missing
      - run: pip-audit --strict || true # advisory until deps are final
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t agentcosign:ci .
      - name: Smoke test the image (hermetic, no credentials)
        run: |
          # Render-like: the platform injects PORT (10000); the app must follow it.
          docker run -d --name ac -e PORT=10000 -p 10000:10000 agentcosign:ci
          for i in $(seq 1 20); do curl -sf http://127.0.0.1:10000/health && break || sleep 1; done
          curl -sf http://127.0.0.1:10000/health | grep -q '"status":"healthy"'
          curl -sf http://127.0.0.1:10000/api/v1/config/policy | grep -q '"refund_auto_limit":"25.00"'
          # Plain Docker default (no PORT): falls back to 8000.
          docker run -d --name ac2 -p 8000:8000 agentcosign:ci
          for i in $(seq 1 20); do curl -sf http://127.0.0.1:8000/health && break || sleep 1; done
          docker logs ac
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # CLI over the whole history: the action diffs `<root>^..HEAD`, which fails on
      # a first push because the root commit has no parent. Pinned and checksummed.
      - name: gitleaks (full history)
        run: |
          V=8.30.1
          B="https://github.com/gitleaks/gitleaks/releases/download/v${V}"
          curl -sSfL "${B}/gitleaks_${V}_linux_x64.tar.gz" -o gl.tgz
          curl -sSfL "${B}/gitleaks_${V}_checksums.txt" -o gl.sum
          grep " gitleaks_${V}_linux_x64.tar.gz$" gl.sum | awk '{print $1"  gl.tgz"}' | sha256sum -c -
          tar -xzf gl.tgz gitleaks
          ./gitleaks git . --redact --no-banner
