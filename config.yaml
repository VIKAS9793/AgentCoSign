# ==============================================================================
# AgentCoSign — Policy & Model Configuration (Single Source of Truth)
# ==============================================================================
# All policy limits, thresholds, and model IDs live here.
# Core code reads from this config — NEVER hardcode limits in logic.
#
# Safety invariants are deliberately NOT knobs and cannot be configured away:
#   - cumulative refunds never exceed the captured amount
#   - a refund on an order with an open dispute escalates
#   - accept_dispute_claim always escalates
#   - a screening verdict of "injection" denies
#   - any gateway or policy error denies (fail closed)
#   - a currency or account mismatch denies
#   - stale or mismatched evidence denies
# Money values are quoted strings so they parse as Decimal, never float.
# Unknown keys are rejected at startup (typos must not silently use defaults).
# ==============================================================================

version: "1.1.0"

# ------------------------------------------------------------------------------
# Policy Rules
# ------------------------------------------------------------------------------
policy:
  currency: "USD"

  # A refund up to this amount is auto-approved when all other checks are clean.
  refund_auto_limit: "25.00"

  # Above the auto limit and up to this amount a refund is escalated to a human;
  # above it the refund is denied.
  refund_max_limit: "250.00"

  # More than this many refunds for one customer in a rolling 24 hours escalates.
  velocity_max_refunds_24h: 3

  # Contractor payouts: what happens for a new or changed payee, and how long a
  # repeat of the same payee, amount and reference counts as a duplicate.
  payout_new_payee_action: "escalate" # escalate | deny  (never allow)
  payout_duplicate_window_days: 30

  # Rolling 24-hour cap on executed plus reserved outflow across all tools.
  daily_outflow_cap: "1000.00"

  # Facts read from PayPal are trusted for this long; older ones are re-read.
  evidence_max_age_seconds: 60

# ------------------------------------------------------------------------------
# Human approval (co-sign)
# ------------------------------------------------------------------------------
approval:
  # A request waits this long for the owner, then expires and releases the money
  # set aside for it. 4 hours covers an interrupted working day; every approval
  # re-checks PayPal and every rule before sending, so a long wait never acts on
  # old facts. Capped at 86400 (24 hours) in code: it cannot be raised here.
  open_seconds: 14400
  # One fingerprint prompt can be answered for this long. Capped at 300 in code.
  fingerprint_seconds: 120
  # A signed-in phone is signed out after this long. Every decision still needs
  # its own fingerprint signature. Capped at 600 in code.
  session_seconds: 600
  # A one-time setup link works for this long. Capped at 600 in code.
  enrolment_link_seconds: 600

# ------------------------------------------------------------------------------
# Prompt-injection screening
# ------------------------------------------------------------------------------
screening:
  # Behaviour when the screening model is unreachable/rate-limited/garbled.
  # Never "allow". Escalate keeps the demo alive without weakening safety.
  on_unavailable: "escalate" # escalate | deny
  max_document_chars: 8000
  # Prompt guard score at or above which a message counts as an attempt to
  # instruct the assistant. A probability, quoted so it parses exactly.
  guard_threshold: "0.50"

# ------------------------------------------------------------------------------
# Model Layer Configurations (Provider endpoints, models, fallbacks)
# ------------------------------------------------------------------------------
models:
  agent:
    provider: "groq"
    primary: "openai/gpt-oss-120b"
    fallback: "qwen/qwen3.8-27b"
    temperature: 0.1
    # gpt-oss are reasoning models: reasoning tokens count against this budget.
    # Check against the live model that tool calls are not truncated.
    max_tokens: 2048
    timeout_seconds: 20

  screening:
    provider: "groq"
    # The safeguard model answers only about 3 requests a minute on the free tier,
    # so it is the fallback; a 429 means "use the other model now", never wait.
    primary: "openai/gpt-oss-20b"
    fallback: "openai/gpt-oss-safeguard-20b"
    temperature: 0.0
    max_tokens: 512
    timeout_seconds: 10

  extraction:
    # Reads the customer's words, so it stays on a provider cleared for customer
    # text (no prompts kept, no training). A different model family from the
    # agent keeps this an independent second reading. A model appearing in the
    # provider's catalogue does not mean this account can call it: always
    # confirm with a real request.
    provider: "groq"
    primary: "qwen/qwen3.8-27b"
    fallback: "openai/gpt-oss-20b"
    temperature: 0.0
    max_tokens: 512
    timeout_seconds: 15

  guard:
    # A small classifier from a different family that scores open attack wording
    # ("ignore all previous instructions") from 0 to 1. It misses social
    # engineering, which screening reads for. The smaller 22m version flagged a
    # genuine message in testing, so there is no second model: if this one is
    # down the guard could not run and screening still decides.
    provider: "groq"
    primary: "meta-llama/llama-prompt-guard-2-86m"
    fallback: "meta-llama/llama-prompt-guard-2-86m"
    temperature: 0.0
    max_tokens: 16
    timeout_seconds: 5

# ------------------------------------------------------------------------------
# Traffic protection (keeps the free-tier service alive and fair)
# ------------------------------------------------------------------------------
# Per-client buckets are fairness. The global caps below are the hard floor:
# they hold even if a client hides or fakes its address.
limits:
  # How many proxies in front of the app append to X-Forwarded-For. The client
  # address is read from that many entries from the right. On the hosted service
  # the chain is: client, edge, internal hop.
  trusted_proxy_hops: 3
  # Header the edge sets to the connecting address; the edge refuses requests that
  # try to send it themselves. Preferred over the chain, which is the fallback.
  client_ip_header: "cf-connecting-ip"
  # Calibration aid: /api/v1/diagnostics/client shows the forwarding chain as
  # received. Confirmed on the real host, so it is off; switch on only to re-check
  # after the hosting provider changes its proxy path.
  expose_client_diagnostics: false
  max_body_bytes: 65536
  # In-flight requests across all clients; beyond this the answer is a fast 503.
  max_concurrent_requests: 32
  # Of those, slots only reviewers may use, so a public flood cannot lock them out.
  reviewer_reserved_concurrency: 8
  # Per-client state is bounded so an address-rotation flood cannot exhaust memory.
  max_tracked_clients: 5000
  exempt_paths: ["/health"]
  # Live update streams: open for minutes, so they have their own cap and never
  # use the in-flight slots above.
  streaming_paths: ["/v1/approvals/stream"]
  max_open_streams: 8

  # A bucket holds `capacity` requests and gains one every `refill_seconds`.
  public:
    general: { capacity: 60, refill_seconds: 1 }
    live_llm: { capacity: 5, refill_seconds: 180 }
    live_execution: { capacity: 2, refill_seconds: 1800 }
  # Reviewers get roomier buckets and their own reserved daily pools.
  reviewer:
    general: { capacity: 240, refill_seconds: 1 }
    live_llm: { capacity: 30, refill_seconds: 20 }
    live_execution: { capacity: 10, refill_seconds: 300 }

  # Live model calls per 24 hours. The model's free-tier limit is 1,000 requests
  # per day; the rest is headroom for the operator and for retries.
  live_llm_budget:
    provider_daily_limit: 1000
    public: 300
    reviewer: 500
  live_execution_budget:
    public: 10
    reviewer: 60
  # When the provider reports less than this percent of its daily quota left,
  # public traffic is served from recorded answers and only reviewers stay live.
  provider_low_percent: 10

  # Clients that keep being rejected are blocked for a while, doubling each time.
  penalty:
    strikes: 8
    strike_window_seconds: 60
    block_seconds: 60
    max_block_seconds: 900

# ------------------------------------------------------------------------------
# Reconciliation with PayPal
# ------------------------------------------------------------------------------
reconciliation:
  # How far back each run compares the refunds we sent with PayPal's records.
  lookback_days: 7
  # A refund PayPal still shows as processing after this long is reported.
  stale_processing_hours: 24
  # How often the comparison runs in the background.
  interval_hours: 24

# ------------------------------------------------------------------------------
# Reading PayPal for the merchant's screens (display only: every decision and
# every refund reads PayPal again on its own)
# ------------------------------------------------------------------------------
audit:
  # How often the whole audit record is checked in the background. A request's
  # history checks its own entries and anything new at once; an edit to an older
  # entry of another request is found by this full check.
  full_check_hours: 24

display:
  # How many orders are read from PayPal at once while a screen loads.
  max_parallel_reads: 4
  # A screen reuses an order read this recent while none of our records
  # changed, so live updates and two open tabs do not repeat PayPal calls.
  reuse_seconds: 10
