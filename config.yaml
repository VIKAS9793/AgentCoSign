# ==============================================================================
# AgentCoSign — Policy & Model Configuration (Single Source of Truth)
# ==============================================================================
# All policy limits, thresholds, and model IDs live here.
# Core code reads from this config — NEVER hardcode limits in logic.
#
# Safety invariants are deliberately NOT knobs and cannot be configured away:
#   - cumulative refunds never exceed the captured amount
#   - a refund on an order with an open dispute escalates
#   - accept_dispute_claim always escalates
#   - a screening verdict of "injection" denies
#   - any gateway or policy error denies (fail closed)
#   - a currency or account mismatch denies
#   - stale or mismatched evidence denies
# Money values are quoted strings so they parse as Decimal, never float.
# Unknown keys are rejected at startup (typos must not silently use defaults).
# ==============================================================================

version: "1.1.0"

# ------------------------------------------------------------------------------
# Policy Rules
# ------------------------------------------------------------------------------
policy:
  currency: "USD"

  # A refund up to this amount is auto-approved when all other checks are clean.
  refund_auto_limit: "25.00"

  # Above the auto limit and up to this amount a refund is escalated to a human;
  # above it the refund is denied.
  refund_max_limit: "250.00"

  # More than this many refunds for one customer in a rolling 24 hours escalates.
  velocity_max_refunds_24h: 3

  # Contractor payouts: what happens for a new or changed payee, and how long a
  # repeat of the same payee, amount and reference counts as a duplicate.
  payout_new_payee_action: "escalate" # escalate | deny  (never allow)
  payout_duplicate_window_days: 30

  # Rolling 24-hour cap on executed plus reserved outflow across all tools.
  daily_outflow_cap: "1000.00"

# ------------------------------------------------------------------------------
# Human approval (co-sign)
# ------------------------------------------------------------------------------
approval:
  # Pending requests expire (and release their reserved budget) after this long.
  # 10 minutes. Reference points: Monzo's in-app 3DS approval window is 10
  # minutes; out-of-band OTP lifetimes are commonly capped at 10 minutes (SMS/phone)
  # and 5 minutes (time-based devices). Capped at 600 in code: it cannot be raised here.
  ttl_seconds: 600
  # Preferred assurance: passkey (WebAuthn) signature over the action hash.
  # "session" is a weaker, clearly-flagged fallback for demo devices without a
  # platform authenticator; the assurance level is written to the audit log.
  allowed_assurance: ["passkey", "session"]

# ------------------------------------------------------------------------------
# Prompt-injection screening
# ------------------------------------------------------------------------------
screening:
  # Behaviour when the screening model is unreachable/rate-limited/garbled.
  # Never "allow". Escalate keeps the demo alive without weakening safety.
  on_unavailable: "escalate" # escalate | deny
  max_document_chars: 8000

# ------------------------------------------------------------------------------
# Model Layer Configurations (Provider endpoints, models, fallbacks)
# ------------------------------------------------------------------------------
models:
  agent:
    provider: "groq"
    primary: "openai/gpt-oss-120b"
    fallback: "qwen/qwen3.8-27b"
    temperature: 0.1
    # gpt-oss are reasoning models: reasoning tokens count against this budget.
    # Check against the live model that tool calls are not truncated.
    max_tokens: 2048
    timeout_seconds: 20

  screening:
    provider: "groq"
    # Free-tier limit on the safeguard model is 3 requests per minute, so a burst
    # gets HTTP 429. Treat 429 as "use the fallback now", never as a reason to wait.
    primary: "openai/gpt-oss-safeguard-20b"
    fallback: "openai/gpt-oss-20b"
    temperature: 0.0
    max_tokens: 512
    timeout_seconds: 10

  extraction:
    provider: "nvidia_nim"
    base_url: "https://integrate.api.nvidia.com/v1"
    # A different model family from the agent keeps this an independent second
    # reading. A model appearing in the provider's catalogue does not mean this
    # account can call it: always confirm with a real one-token request.
    primary: "google/diffusiongemma-26b-a4b-it"
    fallback: "openai/gpt-oss-20b"
    temperature: 0.0
    max_tokens: 512
    timeout_seconds: 15

# ------------------------------------------------------------------------------
# Audit Log & Verification
# ------------------------------------------------------------------------------
audit:
  hash_algorithm: "sha256"
  storage_type: "sqlite"
  table_name: "audit_ledger"
